<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#241f1a"/>
  <title>Picks Game — NFL &amp; College Football</title>
  <style>
    /* Palette from the design canvas. System fonts rather than Barlow and
       JetBrains Mono: near-identical at UI sizes, and one less render-blocking
       request on a phone, which is the case being optimised for. */
    :root{
      --bg:        oklch(0.145 0.006 60);
      --surface:   oklch(0.175 0.006 60);
      --surface-2: oklch(0.205 0.008 60);
      --line:      oklch(0.28 0.008 60);
      --line-soft: oklch(0.24 0.008 60);
      --text:      oklch(0.96 0.004 60);
      --dim:       oklch(0.70 0.006 60);
      --faint:     oklch(0.58 0.006 60);
      --accent:    oklch(0.80 0.16 75);
      --accent-dim:oklch(0.62 0.10 75);
      --win:       oklch(0.72 0.15 150);
      --loss:      oklch(0.63 0.18 25);
      --pend:      oklch(0.55 0.006 60);
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg); color:var(--text); font-family:var(--sans);
      -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.45;
    }
    .wrap{max-width:1560px;margin:0 auto;padding:0 14px 28px}
    .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
    .hidden{display:none !important}
    button,select,input{font:inherit;color:inherit}
    button{cursor:pointer;border:none;background:none}
    a{color:var(--accent);text-decoration:none}

    /* ---------------------------------------------------------------- header */
    header{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;padding:14px 0 10px}
    .brand{font-family:var(--mono);font-size:11px;letter-spacing:.18em;
           text-transform:uppercase;color:var(--accent);font-weight:700}
    .headRight{display:flex;align-items:center;gap:10px;flex:none}
    .seasonBar{display:flex;align-items:center;gap:7px;margin-top:4px}
    .seasonBar label{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
                     text-transform:uppercase;color:var(--faint)}
    .seasonBar select{background:var(--surface);border:1px solid var(--line);border-radius:999px;
                      padding:5px 10px;font-size:12px;font-family:var(--mono)}
    .seasonBar.stale select{border-color:var(--accent);color:var(--accent)}
    #userBadge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
               background:var(--surface-2);border:1px solid var(--line);
               font-size:11.5px;font-weight:700;cursor:pointer;flex:none}

    /* The email IS the identity - there is no login - so it lives on the page. */
    .identity{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .identity input{background:var(--surface);border:1px solid var(--line);border-radius:10px;
                    padding:10px 12px;font-size:14px;width:100%}
    .identity input::placeholder{color:var(--faint)}
    .identity input:focus{outline:none;border-color:var(--accent-dim)}

    /* ---------------------------------------------------------------- tabs */
    .tabs{display:flex;gap:4px;padding:4px;background:var(--surface);
          border:1px solid var(--line-soft);border-radius:12px;margin-bottom:14px;
          overflow-x:auto;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{flex:1 0 auto;padding:9px 12px;border-radius:9px;text-align:center;
         font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap}
    .tab.active{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}

    /* ---------------------------------------------------------------- shared */
    .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
             text-transform:uppercase;color:var(--faint)}
    .hint{color:var(--faint);font-size:12.5px}
    .empty{padding:26px 18px;text-align:center;color:var(--faint);font-size:13px;
           border:1px dashed var(--line);border-radius:12px;line-height:1.6}
    .alert{padding:9px 12px;border-radius:10px;font-weight:600;font-size:13px;margin-top:7px}
    .alert.ok{background:oklch(0.72 0.15 150 / .14);color:var(--win)}
    .alert.err{background:oklch(0.63 0.18 25 / .14);color:var(--loss)}

    /* ---------------------------------------------- week bar + filters */
    .weekBar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .weekBar button.nav{width:36px;height:36px;border-radius:10px;background:var(--surface);
                        border:1px solid var(--line);color:var(--dim);font-size:17px;line-height:1;flex:none}
    .weekBar .mid{flex:1;text-align:center}
    #weekLabel{font-size:16px;font-weight:700;letter-spacing:-.01em;display:block}
    .lockNote{font-family:var(--mono);font-size:9px;letter-spacing:.13em;
              text-transform:uppercase;color:var(--faint);margin-top:2px;display:block}

    .filterRow{display:flex;gap:8px;margin-bottom:10px;align-items:center}
    #gameSearch{flex:1;background:var(--surface);border:1px solid var(--line);
                border-radius:10px;padding:9px 12px;font-size:14px;min-width:0}
    #gameSearch:focus{outline:none;border-color:var(--accent-dim)}
    #sportFilter{display:flex;gap:4px;background:var(--surface);
                 border:1px solid var(--line-soft);border-radius:10px;padding:3px;flex:none}
    #sportFilter .seg{padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600;
                      color:var(--dim);cursor:pointer}
    #sportFilter .seg.on{background:var(--surface-2);color:var(--accent);
                         box-shadow:inset 0 0 0 1px var(--line)}
    #btnSort{background:var(--surface);border:1px solid var(--line);border-radius:10px;
             padding:9px 11px;font-size:12px;color:var(--dim);white-space:nowrap;flex:none}

    /* ---------------------------------------------------------- odds grid */
    .gridHead{display:grid;grid-template-columns:1fr 74px 74px 62px;gap:1px;
              padding:0 2px 6px;font-family:var(--mono);font-size:9px;
              letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
    .gridHead span:not(:first-child){text-align:center}
    .game{background:var(--surface);border:1px solid var(--line-soft);
          border-radius:12px;margin-bottom:8px;overflow:hidden}
    .game .gh{display:flex;align-items:center;gap:8px;padding:6px 10px;
              border-bottom:1px solid var(--line-soft);font-family:var(--mono);
              font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
    .game .gh .lg{color:var(--dim)}
    .game .gh .badge{margin-left:auto;color:var(--accent);border:1px solid var(--accent);
                     border-radius:999px;padding:2px 7px;font-size:8.5px;letter-spacing:.12em}
    .gameRow{display:grid;grid-template-columns:1fr 74px 74px 62px;gap:1px;background:var(--line-soft)}
    .gameRow + .gameRow{margin-top:1px}
    .team{background:var(--surface);padding:0 10px;display:flex;align-items:center;
          min-height:46px;overflow:hidden}
    .team .abbr{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cell{background:var(--surface);min-height:46px;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:1px;font-family:var(--mono);
          line-height:1.1;transition:background .1s,opacity .1s}
    .cell .main{font-size:13.5px;font-weight:600}
    .cell .odds{font-size:10px;color:var(--faint)}
    .cell.pickable{cursor:pointer}
    .cell.pickable:active{background:var(--surface-2)}
    .cell.selected{background:oklch(0.80 0.16 75 / .16);box-shadow:inset 0 0 0 1.5px var(--accent)}
    .cell.selected .main{color:var(--accent)}
    /* Illegal cells dim and stop responding. The grid never offers a slip the
       server would refuse, so there is no error banner to dismiss. */
    /* Dim but still tappable. A title tooltip never appears on a phone, so a
       dead cell that swallowed the tap would leave you with no way to find out
       why - which is exactly the confusion this is here to prevent. */
    .cell.dead,.cell.blank{opacity:.28;cursor:not-allowed}
    .game.started{opacity:.55}
    #cellNote{
      position:fixed;left:50%;transform:translateX(-50%);bottom:172px;z-index:40;
      background:oklch(0.26 0.008 60);border:1px solid var(--line);border-radius:999px;
      padding:8px 15px;font-size:12.5px;color:var(--text);white-space:nowrap;
      max-width:92vw;overflow:hidden;text-overflow:ellipsis;
      box-shadow:0 6px 20px rgba(0,0,0,.45);opacity:0;pointer-events:none;
      transition:opacity .15s;
    }
    #cellNote.on{opacity:1}
    @media (min-width:900px){ #cellNote{bottom:24px} }

    /* ------------------------------------------------------------ slot bar */
    #picksList{position:fixed;left:0;right:0;bottom:0;z-index:30;
               background:oklch(0.16 0.006 60 / .97);backdrop-filter:blur(10px);
               border-top:1px solid var(--line);
               padding:8px 14px calc(8px + env(safe-area-inset-bottom))}
    .slotTally{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .slotTally .eyebrow{flex:1}
    .tally{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--faint)}
    .tally.done{color:var(--accent)}
    .slots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
    .slot{border:1px dashed var(--line);border-radius:9px;padding:5px 4px;min-height:44px;
          display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:1px;text-align:center;overflow:hidden}
    .slot .role{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--faint)}
    .slot .pick{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;
                text-overflow:ellipsis;max-width:100%}
    .slot .sub{font-family:var(--mono);font-size:9px;color:var(--dim)}
    .slot .wide{display:none}
    .slot .narrow{display:inline}
    .slot.filled{border-style:solid;border-color:var(--accent-dim);
                 background:oklch(0.80 0.16 75 / .08);cursor:pointer}
    .slot.filled .role{color:var(--accent-dim)}
    #btnSubmit{width:100%;margin-top:7px;padding:12px;border-radius:11px;
               background:var(--surface-2);color:var(--faint);font-weight:700;
               font-size:14px;border:1px solid var(--line)}
    #btnSubmit.ready{background:var(--accent);color:oklch(0.18 0.02 75);border-color:var(--accent)}
    #btnSubmit:disabled{cursor:not-allowed}
    #view-picks{padding-bottom:150px}

    /* --------------------------------------------------------------- slip */
    .slipHead{display:flex;align-items:baseline;gap:10px;margin:14px 0 10px}
    .slipHead .wk{font-size:17px;font-weight:700}
    .slipHead .rec{margin-left:auto;font-family:var(--mono);font-size:19px;font-weight:700}
    /* Flex, not grid. A 1fr track is minmax(auto,1fr), and its auto minimum
       fights a long matchup string until every word wraps onto its own line.
       flex:1 with min-width:0 lets the text shrink and ellipsis instead. */
    .pickRow{display:flex;align-items:stretch;background:var(--surface);
             border:1px solid var(--line-soft);border-radius:11px;margin-bottom:6px;
             overflow:hidden;min-height:58px}
    .pickRow .bar{position:static;width:3px;flex:none;background:var(--pend)}
    .pickRow.win  .bar{background:var(--win)}
    .pickRow.loss .bar{background:var(--loss)}
    .pickRow.live .bar{background:var(--accent)}
    .pickRow .mid{flex:1;min-width:0;padding:9px 4px 9px 11px;display:flex;
                  flex-direction:column;justify-content:center;gap:2px}
    .pickRow .mid > *{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pickRow .sel{font-weight:700;font-size:14.5px}
    .pickRow .matchup{font-size:11.5px;color:var(--faint)}
    .pickRow .role{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
                   color:var(--faint);text-transform:uppercase}
    .pickRow .right{flex:none;padding:9px 12px 9px 8px;display:flex;flex-direction:column;
                    align-items:flex-end;justify-content:center;gap:3px}
    .pickRow .odds{font-family:var(--mono);font-size:13px;color:var(--dim)}
    .pickRow .status{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--pend)}
    .pickRow.win  .status{color:var(--win)}
    .pickRow.loss .status{color:var(--loss)}
    .weekRow{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--surface);
             border:1px solid var(--line-soft);border-radius:11px;margin-bottom:6px;cursor:pointer}
    .weekRow .rec{margin-left:auto;font-family:var(--mono);font-weight:700}

    /* --------------------------------------------------------------- board */
    .segRow{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line-soft);
            border-radius:11px;padding:3px;margin-bottom:12px}
    .segRow .seg{flex:1;padding:8px;border-radius:8px;text-align:center;font-size:13px;
                 font-weight:600;color:var(--dim);cursor:pointer}
    .segRow .seg.on{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
    table.board{width:100%;border-collapse:collapse}
    table.board th{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--faint);
                   text-transform:uppercase;text-align:right;padding:0 0 8px;font-weight:500}
    table.board th:nth-child(1){text-align:center;width:26px}
    table.board th:nth-child(2){text-align:left}
    table.board td{padding:9px 0;border-top:1px solid var(--line-soft);vertical-align:middle}
    table.board td:not(:nth-child(2)){text-align:right;font-family:var(--mono)}
    table.board td:nth-child(1){text-align:center;color:var(--faint);font-size:13px}
    table.board tr.leader td{background:oklch(0.80 0.16 75 / .07)}
    table.board tr.leader td:nth-child(1){color:var(--accent);font-weight:700}
    .bname{font-weight:600;font-size:14.5px}
    .brate{height:2.5px;background:var(--line);border-radius:2px;margin-top:5px;
           max-width:170px;overflow:hidden}
    .brate i{display:block;height:100%;background:var(--accent-dim);border-radius:2px}
    tr.leader .brate i{background:var(--accent)}
    .bpct{font-weight:700;font-size:14.5px}
    /* Owing picks: dimmed rather than coloured red. It is a nudge, not a
       failure, and half the table can be in this state on a Wednesday. */
    table.board tr.owing td{opacity:.5}
    .owe{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
         color:var(--accent);text-transform:uppercase;margin-top:3px}

    /* ------------------------------------------------------------- queries */
    .qControls{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
    .qField{display:flex;flex-direction:column;gap:4px}
    .qField select{background:var(--surface);border:1px solid var(--line);border-radius:10px;
                   padding:10px 12px;font-size:14px;width:100%}
    .qTitle{font-size:19px;font-weight:700;letter-spacing:-.01em}
    #qSummary{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint);
              text-transform:uppercase;margin-bottom:12px}
    .chartRows{display:flex;flex-direction:column;gap:7px}
    .chartRow{display:grid;grid-template-columns:minmax(88px,132px) 1fr auto;gap:9px;align-items:center}
    .chartRow .lbl{font-size:12.5px;color:var(--dim);overflow:hidden;
                   text-overflow:ellipsis;white-space:nowrap}
    .chartRow .val{font-family:var(--mono);font-size:11.5px;color:var(--dim);
                   text-align:right;min-width:92px}
    .track{position:relative;height:22px;background:var(--surface);
           border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
    /* Scoped to .track deliberately. An unscoped .bar also matched the status
       stripe in a pick row, which then took position:absolute with no
       positioned ancestor and stretched down the whole page as a green line
       against the left edge, clipping the header with it. */
    .track .bar{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--accent-dim)}
    .track .bar.top{background:var(--accent)}
    .track .bar.neg,.track .bar.loss{background:var(--loss)}
    .track .bar.pos,.track .bar.win{background:var(--accent-dim)}
    .track .zero{position:absolute;top:0;bottom:0;width:1px;background:var(--faint)}
    .chartEmpty{padding:26px 18px;text-align:center;color:var(--faint);font-size:13px;
                border:1px dashed var(--line);border-radius:12px}
    #qNote{margin-top:12px;color:var(--faint);font-size:12px;line-height:1.5}
    .lineWrap{background:var(--surface);border:1px solid var(--line-soft);
              border-radius:12px;padding:10px 8px 4px}
    .lineWrap svg{display:block;width:100%;height:auto}

    /* ------------------------------------------------------------------ hof */
    .champ{background:linear-gradient(180deg, oklch(0.80 0.16 75 / .13), oklch(0.80 0.16 75 / .03));
           border:1px solid oklch(0.80 0.16 75 / .4);border-radius:16px;
           padding:20px 16px;text-align:center;margin-bottom:16px}
    .champ img{width:104px;height:auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.45))}
    .champ .nm{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
    .champ .yr{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent)}
    .champStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
    .champStats div{background:oklch(0.145 0.006 60 / .5);border-radius:10px;padding:9px 6px}
    .champStats b{display:block;font-family:var(--mono);font-size:17px}
    .champStats span{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--faint)}
    .pastRow{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--surface);
             border:1px solid var(--line-soft);border-radius:11px;margin-bottom:6px}
    .pastRow img{width:34px;height:auto;opacity:.85}
    .titleChips{display:flex;flex-wrap:wrap;gap:6px}
    .titleChip{background:var(--surface);border:1px solid var(--line);border-radius:999px;
               padding:5px 11px;font-size:12px}
    .titleChip b{color:var(--accent);font-family:var(--mono)}

    /* ------------------------------------------------------- desktop, 900px */
    @media (min-width:900px){
      .wrap{padding:0 22px 40px}
      /* Desktop has the width for it beside the brand. */
      .identity{grid-template-columns:190px 240px;margin:-52px 0 14px;
                justify-content:end;padding-right:46px}
      .tabs{display:inline-flex;gap:6px}
      .tab{flex:0 0 auto;padding:9px 16px}
      #view-picks{padding-bottom:0;display:grid;grid-template-columns:1fr 330px;
                  gap:20px;align-items:start}
      .picksMain{min-width:0}
      #picksList{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line-soft);
                 border-radius:14px;padding:14px;backdrop-filter:none;z-index:1}
      .slots{grid-template-columns:1fr;gap:6px}
      .slot{flex-direction:row;justify-content:flex-start;text-align:left;gap:10px;
            padding:9px 11px;min-height:46px}
      .slot .pick{flex:1;text-align:left}
      .slot .wide{display:inline}
      .slot .narrow{display:none}
      .gridHead,.gameRow{grid-template-columns:1fr 108px 108px 92px}
      .qControls{grid-template-columns:repeat(4,1fr)}
      .chartRow{grid-template-columns:minmax(120px,220px) 1fr auto}
      .qBody{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
      .champStats{max-width:420px;margin-inline:auto}
    }
    @media (max-width:899px){ .qRail{display:none} }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Picks Game</div>
      <div class="seasonBar">
        <label for="seasonPicker">Season</label>
        <select id="seasonPicker"><option>loading…</option></select>
      </div>
    </div>
    <div class="headRight">
      <div id="userBadge" class="hidden" title="Sign out"></div>
      <button id="btnLogout" class="hidden">Sign out</button>
    </div>
  </header>

  <!-- The email is the identity, so it stays on the page. Full width on a
       phone: squeezed beside the brand it truncates to "reid@..." and reads
       like a bug. -->
  <div class="identity">
    <input id="nameInput" type="text" placeholder="Your name" autocomplete="name"/>
    <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email"/>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="picks">Picks</div>
    <div class="tab" data-tab="mine">My Picks</div>
    <div class="tab" data-tab="board">Board</div>
    <div class="tab" data-tab="queries">Queries</div>
    <div class="tab" data-tab="hof">HOF</div>
  </div>

  <!-- ========================================================= MAKE PICKS -->
  <section id="view-picks" class="view">
    <div class="picksMain">
      <div class="weekBar">
        <button class="nav" id="btnPrevWeek" aria-label="Previous week">&lsaquo;</button>
        <div class="mid">
          <button id="btnThisWeek" style="width:100%">
            <span id="weekLabel">Week of —</span>
            <span class="lockNote">Each game locks at kickoff</span>
          </button>
        </div>
        <button class="nav" id="btnNextWeek" aria-label="Next week">&rsaquo;</button>
      </div>

      <div class="filterRow">
        <input id="gameSearch" type="search" placeholder="Search teams"/>
        <div id="sportFilter">
          <div class="seg on" data-value="ALL">All</div>
          <div class="seg" data-value="NFL">NFL</div>
          <div class="seg" data-value="NCAAF">CFB</div>
        </div>
        <button id="btnSort">Kickoff</button>
      </div>

      <div class="gridHead"><span>Team</span><span>Spread</span><span>Total</span><span>ML</span></div>
      <div id="games" aria-live="polite"></div>
      <div id="weekStatus" class="hint" style="margin-top:10px"></div>
      <button id="btnRefresh" class="hidden">Refresh</button>

      <!-- The rule counters still exist. They are rendered as slots and a
           tally rather than a row of tags, but the elements and their text are
           unchanged so the copy matches what the server enforces. -->
      <div id="rulesBar" class="hidden">
        <span id="ruleNFL"></span><span id="ruleCFB"></span><span id="ruleOU"></span>

  <!-- ============================================================== QUERIES -->
  <section id="view-queries" class="view hidden">
    <div class="qControls">
      <div class="qField"><label class="eyebrow" for="qView">View</label>
        <select id="qView">
          <option value="players">Win % by player</option>
          <option value="markets">Win % by market</option>
          <option value="units">Units by market</option>
          <option value="leagues">NFL vs college</option>
          <option value="weeks">Win % by week</option>
          <option value="cum">Cumulative units</option>
          <option value="teamsW">Best teams</option>
          <option value="teamsL">Worst teams</option>
          <option value="teamsPct">Win % by team</option>
        </select></div>

        <select id="qPlayer"></select></div>
      <div class="qField" id="qMinField"><label class="eyebrow" for="qMinPicks">Min picks</label>
        <select id="qMinPicks">
          <option value="1">1+ — everything</option>
          <option value="2">2+</option>
          <option value="3">3+</option>
          <option value="4">4+ — default</option>
          <option value="6">6+</option>
          <option value="8">8+</option>
          <option value="10">10+ — only the regulars</option>
        </select></div>

        <div class="hint" id="qSeasonEcho" style="padding:11px 2px"></div></div>
    </div>
    <div class="qBody">
      <div style="min-width:0">
        <div class="qTitle" id="qTitle"></div>
        <div id="qSummary"></div>

  <!-- ======================================================== HALL OF FAME -->

</div>

<script>
/* A pg_api override in localStorage beats the URL baked in at build time, and
   it survives every redeploy. That is the point of it for local testing, but a
   stale one silently breaks the live site for whoever set it, with no symptom
   beyond "Failed to fetch" and no way out that does not involve a developer
   console. So: visiting /?reset=1 clears it. */
if (/[?&]reset=1(&|$)/.test(location.search)) {
  try { localStorage.removeItem('pg_api'); } catch (_) {}
  location.replace(location.pathname);
}

const CONFIG = {
  API: (function () {
    try { const o = localStorage.getItem('pg_api'); if (o) return o; } catch (_) {}
    return '__APPS_SCRIPT_URL__';
  })(),
  /* True when an override is in play, so the page can say so rather than
     leaving you to wonder why it disagrees with what was deployed. */
  OVERRIDDEN: (function () {
    try { return !!localStorage.getItem('pg_api'); } catch (_) { return false; }
  })()
};

function apiConfigured() {
  return /^https?:\/\/\S+$/.test(String(CONFIG.API || ''));
}

/* =================== HELPERS =================== */
const el  = (s) => document.querySelector(s);
const els = (s) => Array.prototype.slice.call(document.querySelectorAll(s) || []);

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const pctText  = (r) => (r.w + r.l) ? (r.w / (r.w + r.l)).toFixed(3).replace(/^0/, '') : '-';
const recText  = (r) => r.w + '-' + r.l + (r.p ? '-' + r.p : '');
const unitText = (u) => (u > 0 ? '+' : '') + Number(u || 0).toFixed(2) + 'u';
const signed   = (n) => (Number(n) > 0 ? '+' : '') + n;
const numOr    = (v, d) => { const n = Number(v); return isFinite(n) ? n : d; };

function startOfWedWeek(d){ const dt=new Date(d); dt.setHours(0,0,0,0);
  const diff=(dt.getDay()-3+7)%7; dt.setDate(dt.getDate()-diff); return dt; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
/* Local calendar date, not a UTC slice: toISOString on local midnight lands a
   day early for any positive UTC offset. */
function isoDate(d){ const x=new Date(d);
  return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2); }
function fmtWeek(d){ return 'Week of ' + new Date(d).toLocaleDateString(undefined,
  { month:'short', day:'numeric' }); }
function inRangeLocal(iso,start,end){
  if(!iso) return false;
  const t=new Date(iso), a=new Date(start), b=new Date(end);
  a.setHours(0,0,0,0); b.setHours(23,59,59,999);
  return t>=a && t<=b;
}

/* Which season a date belongs to. August to July, so a January bowl stays in
   the season that started the previous August - the same rule the server uses,
   because the two disagreeing would put a pick in a year the page did not
   show. */
function seasonOfDate(d){
  const x = new Date(d);
  const y = x.getFullYear(), m = x.getMonth() + 1;
  const start = m >= 8 ? y : y - 1;
  return start + '-' + String(start + 1).slice(2);
}

/* Kickoff in the past. An absent or unparseable kickoff is NOT started - the
   forgiving side, and the same call the server makes. */
function gameStarted(game){
  const iso = game && (game.kickoff || game.commence_time);
  if (!iso) return false;
  const t = new Date(iso).getTime();
  return isFinite(t) && t <= Date.now();
}

/* Display-only shortening. The full feed string is what gets submitted -
   grading matches on it, so an abbreviation must never leave the page. */
const NFL_ABBR = {
  'Arizona Cardinals':'Cardinals','Atlanta Falcons':'Falcons','Baltimore Ravens':'Ravens',
  'Buffalo Bills':'Bills','Carolina Panthers':'Panthers','Chicago Bears':'Bears',
  'Cincinnati Bengals':'Bengals','Cleveland Browns':'Browns','Dallas Cowboys':'Cowboys',
  'Denver Broncos':'Broncos','Detroit Lions':'Lions','Green Bay Packers':'Packers',
  'Houston Texans':'Texans','Indianapolis Colts':'Colts','Jacksonville Jaguars':'Jaguars',
  'Kansas City Chiefs':'Chiefs','Las Vegas Raiders':'Raiders','Los Angeles Chargers':'Chargers',
  'Los Angeles Rams':'Rams','Miami Dolphins':'Dolphins','Minnesota Vikings':'Vikings',
  'New England Patriots':'Patriots','New Orleans Saints':'Saints','New York Giants':'Giants',
  'New York Jets':'Jets','Philadelphia Eagles':'Eagles','Pittsburgh Steelers':'Steelers',
  'San Francisco 49ers':'49ers','Seattle Seahawks':'Seahawks','Tampa Bay Buccaneers':'Buccaneers',
  'Tennessee Titans':'Titans','Washington Commanders':'Commanders'
};
/* Only the NFL map, which is a real shortening. No character truncation:
   the column is 700px wide on a desktop and 120px on a phone, and JavaScript
   cannot know which - so it returns the whole name and CSS ellipsis decides.
   Truncating here cut "Virginia Cavaliers" down on a screen with room to
   spare. */
function shortName(full){
  const n = String(full || '');
  return NFL_ABBR[n] || n;
}

/* For a slot barely wider than a thumb: whichever team name is shorter still
   identifies the game, where "San Jose State Spartans @ …" identifies nothing
   once it is cut off. */
function briefMatchup(matchup){
  const sides = String(matchup || '').split(' @ ');
  if (sides.length !== 2) return String(matchup || '');
  const a = shortName(sides[0]), b = shortName(sides[1]);
  return a.length <= b.length ? a : b;
}

/* =================== SEASON =================== */
/* One selector governs every tab. sessionStorage rather than localStorage on
   purpose: the choice should survive moving between tabs and reloading, but a
   fresh visit should open on the newest season rather than on whatever somebody
   was reading about last month. */
const SEASON_KEY = 'pg_season';
const SEASON = {
  list: [],
  get current(){ try { return sessionStorage.getItem(SEASON_KEY) || ''; } catch(_){ return ''; } },
  set current(v){ try { v ? sessionStorage.setItem(SEASON_KEY, v)
                          : sessionStorage.removeItem(SEASON_KEY); } catch(_){} },
  get newest(){ return this.list.length ? this.list[0].season : ''; }
};

/* Every read goes through here, so a new endpoint is season-aware without
   anyone having to remember to make it so. */
function apiUrl(fn, params) {
  let u = CONFIG.API + '?fn=' + encodeURIComponent(fn);
  const p = params || {};
  for (const k of Object.keys(p)) {
    if (p[k] === undefined || p[k] === null || p[k] === '') continue;
    u += '&' + k + '=' + encodeURIComponent(p[k]);
  }
  const s = SEASON.current;
  if (s && s !== 'all') u += '&season=' + encodeURIComponent(s);
  return u;
}

async function loadSeasons(){
  const sel = el('#seasonPicker');
  try{
    const r = await fetch(CONFIG.API + '?fn=seasons');
    const j = await r.json();
    SEASON.list = (j && j.seasons) || [];
  }catch(_){ SEASON.list = []; }

  if (!SEASON.list.length){ sel.innerHTML = '<option value="">No data yet</option>'; return; }

  /* A season saved earlier may no longer exist - the data can be reworked
     between visits. Fall back to the newest rather than silently filtering
     everything down to nothing. */
  const saved = SEASON.current;
  if (!saved || !SEASON.list.some(s => s.season === saved)) SEASON.current = SEASON.newest;

  sel.innerHTML = SEASON.list.map(s =>
      '<option value="' + esc(s.season) + '">' + esc(s.season)
      + (s.picks ? '' : ' — no picks yet') + '</option>').join('')
    + '<option value="all">All seasons</option>';
  sel.value = SEASON.current;
  markSeasonStale();
}

/* Highlight the selector when it is not on the newest season, so nobody spends
   ten minutes wondering why this week's games are missing. */
function markSeasonStale(){
  const bar = el('.seasonBar');
  const s = SEASON.current;
  if (bar) bar.classList.toggle('stale', !!s && s !== SEASON.newest);
  const echo = el('#qSeasonEcho');
  if (echo) echo.textContent = s || 'all';
}

/* Put the Make Picks week inside the selected season. Without this the
   selector governs what you read but not what you write, and a pick made while
   "2026-27" is showing can land in a different year entirely. */
async function alignWeekToSeason(){
  const want = SEASON.current;
  if (!want || want === 'all') return false;
  if (seasonOfDate(state.weekStart) === want) return false;

  const today = startOfWedWeek(new Date());
  if (seasonOfDate(today) === want) {
    state.weekStart = today;                       // the live season: this week
  } else {
    /* A past season: land on its most recent week that has picks, so the tab
       shows something real rather than an arbitrary date. */
    let landed = null;
    try {
      const r = await fetch(apiUrl('weeks'));
      const j = await r.json();
      const wk = ((j && j.weeks) || [])[0];
      if (wk && /^\d{4}-\d{2}-\d{2}$/.test(wk.week)) {
        const [y, m, d] = wk.week.split('-').map(Number);
        landed = new Date(y, m - 1, d);
      }
    } catch (_) {}
    state.weekStart = landed || new Date(Number(want.slice(0, 4)), 8, 1);
  }
  updateWeekLabel();
  filterByWeek();
  return true;
}

async function refreshSeasonViews(){
  markSeasonStale();
  await alignWeekToSeason();
  const active = el('.tab.active');
  const tab = active ? active.dataset.tab : 'picks';
  if (tab === 'board')   await buildBoard();
  if (tab === 'queries') await buildQueries();
  if (tab === 'mine')    await loadMyPicks();
  if (tab === 'hof')     await buildHof();
}

/* =================== STATE =================== */
const state = {
  name:null, email:null,
  weekStart:startOfWedWeek(new Date()),
  gamesAll:[], games:[],
  picks:[],                 // 5 total: 4 standard + 1 ML
  sport:'ALL', query:'', sort:0,
  boardMode:'season'
};
const SORTS = ['Kickoff', 'Biggest spread', 'Closest line'];

/* =================== ODDS =================== */
async function fetchOdds(){
  const root = el('#games');
  root.innerHTML = '<div class="empty">Loading games…</div>';
  try{
    const startISO = isoDate(state.weekStart);
    const getJSON = async (url) => {
      const r = await fetch(url);
      const text = await r.text();
      try { return JSON.parse(text); }
      catch(e){ throw new Error('Non-JSON response: ' + text.slice(0,140)); }
    };
    const nfl   = await getJSON(CONFIG.API+'?fn=odds&league=nfl&weekStart='+startISO+'&nocache=1');
    const ncaaf = await getJSON(CONFIG.API+'?fn=odds&league=ncaaf&weekStart='+startISO+'&nocache=1');
    if (nfl && nfl.ok === false)     throw new Error('NFL odds: '   + (nfl.error||'unknown'));
    if (ncaaf && ncaaf.ok === false) throw new Error('NCAAF odds: ' + (ncaaf.error||'unknown'));

    const g1=((nfl && nfl.games)||[]).map(x=>Object.assign({},x,{league:'NFL'}));
    const g2=((ncaaf && ncaaf.games)||[]).map(x=>Object.assign({},x,{league:'NCAAF'}));
    state.gamesAll = g1.concat(g2);
    filterByWeek();
  }catch(e){
    /* "Failed to fetch" reads identically whether the backend is down, a saved
       override is stale, or this page is a cached copy - and those have three
       different fixes. Say which address was actually used. */
    const api = String(CONFIG.API || '(none)');
    const tail = api.length > 54 ? api.slice(0, 40) + '…' + api.slice(-10) : api;
    root.innerHTML = '<div class="empty">Could not load games.<br>' + esc(e.message || e)
      + '<br><br>Tried: <span class="mono">' + esc(tail) + '</span>'
      + (CONFIG.OVERRIDDEN
          ? '<br><strong>That address came from this browser, not the deployed site.</strong>'
            + '<br><a href="?reset=1">Clear it and reload.</a>'
          : '<br>That is the deployed address. If it looks wrong, reload with Ctrl+Shift+R.')
      + '</div>';
  }
}

function filterByWeek(){
  const start = state.weekStart, end = addDays(start, 6);
  state.games = state.gamesAll.filter(g => inRangeLocal(g.kickoff || g.commence_time, start, end));
  renderGames();
}

/* =================== LEGALITY =================== */
/* The grid never offers a slip the server would refuse, so there is no error
   banner: an illegal cell simply dims and stops responding. */
function roleOf(market, kind){
  return market === 'moneyline' ? 'ml' : String(kind || '').toLowerCase();
}
function pickKeyOf(p){ return [p.gameId,p.market,p.kind,p.selection].join('|'); }
function isPicked(gameId, market, kind, selection){
  const k = [gameId, market, kind, selection].join('|');
  return state.picks.some(p => pickKeyOf(p) === k);
}

/** Why this cell cannot be taken, or null when it can. */
function cellBlocked(game, market, kind, odds){
  if (gameStarted(game)) return 'started';
  if (state.picks.length >= 5) return 'full';
  const role = roleOf(market, kind);
  const nonML = state.picks.filter(p => p.market !== 'moneyline');
  const ml    = state.picks.filter(p => p.market === 'moneyline');

  if (role === 'ml') {
    if (ml.length >= 1) return 'role';
    /* Strictly greater than -200. Exactly -200 is not allowed. */
    const n = Number(odds);
    if (!(isFinite(n) && n > -200)) return 'price';
    return null;
  }
  if (nonML.some(p => roleOf(p.market, p.kind) === role)) return 'role';
  const lg = String(game.league || '').toUpperCase();
  if (nonML.filter(p => String(p.league).toUpperCase() === lg).length >= 2) return 'league';
  return null;
}

/* =================== ODDS GRID =================== */
function sortGames(list){
  const arr = list.slice();
  if (state.sort === 1)
    arr.sort((a,b)=> Math.abs(numOr(a.spread&&a.spread.line,0)) < Math.abs(numOr(b.spread&&b.spread.line,0)) ? 1 : -1);
  else if (state.sort === 2)
    arr.sort((a,b)=> Math.abs(numOr(a.spread&&a.spread.line,99)) - Math.abs(numOr(b.spread&&b.spread.line,99)));
  else
    arr.sort((a,b)=> String(a.kickoff||'').localeCompare(String(b.kickoff||'')));
  return arr;
}

function renderGames(){
  const root = el('#games');
  if (!root) return;
  const q = state.query.trim().toLowerCase();
  let list = state.games.filter(g =>
    (state.sport === 'ALL' || String(g.league).toUpperCase() === state.sport) &&
    (!q || String(g.home_team + ' ' + g.away_team).toLowerCase().indexOf(q) >= 0));
  list = sortGames(list);

  const sortBtn = el('#btnSort'); if (sortBtn) sortBtn.textContent = SORTS[state.sort];
  const ws = el('#weekStatus');
  if (ws) ws.textContent = list.length ? list.length + ' game' + (list.length===1?'':'s') + ' shown' : '';
  /* validateRules may have something more important to say about this week. */
  validateRules();

  if (!list.length){
    root.innerHTML = '<div class="empty">'
      + (state.gamesAll.length ? 'No games match. Try another week, or clear the search.'
                              : 'No games loaded yet.') + '</div>';
    return;
  }

  root.innerHTML = list.map(gameHtml).join('');
  els('#games .cell.pickable').forEach(c => {
    c.addEventListener('click', () => {
      const g = state.games.find(x => String(x.id) === c.dataset.game);
      if (!g) return;
      let meta = {}; try { meta = JSON.parse(c.dataset.meta || '{}'); } catch(_){}
      togglePick(g, c.dataset.market, c.dataset.kind, c.dataset.sel, meta,
                 c.dataset.odds === '' ? '' : Number(c.dataset.odds));
    });
  });
  /* A dead cell answers the question instead of ignoring the tap. */
  els('#games .cell.dead, #games .cell.blank').forEach(c => {
    c.addEventListener('click', () => sayWhy(c.getAttribute('title')));
  });
}

let cellNoteTimer = null;
function sayWhy(text){
  const n = el('#cellNote');
  if (!n || !text) return;
  n.textContent = text;
  n.classList.add('on');
  clearTimeout(cellNoteTimer);
  cellNoteTimer = setTimeout(() => n.classList.remove('on'), 2600);
}

/* Why a cell is dim, in words. Without this a dimmed cell is indistinguishable
   from a broken one, and the only way to find out is to ask somebody. */
const BLOCK_REASON = {
  started: 'This game has already kicked off',
  full:    'Your slip is full - clear a slot to change a pick',
  league:  'You already have two picks in this league',
  price:   'A moneyline must be priced better than -200'
};
const ROLE_REASON = {
  favorite:'You already have a favourite', underdog:'You already have an underdog',
  over:'You already have an over', under:'You already have an under',
  ml:'You already have a moneyline'
};
function blockText(reason, market, kind){
  if (reason === 'role') return ROLE_REASON[roleOf(market, kind)] || 'That role is already used';
  return BLOCK_REASON[reason] || '';
}

/* hideOdds: the moneyline cell's value IS the price, so repeating it
   underneath prints the same number twice. */
function cellHtml(g, market, kind, sel, main, odds, meta, hideOdds){
  if (main === null || main === undefined || main === '')
    return '<div class="cell blank" title="Not priced"></div>';
  const selected = isPicked(g.id, market, kind, sel);
  const blocked  = selected ? null : cellBlocked(g, market, kind, odds);
  const cls = 'cell ' + (selected ? 'selected pickable' : (blocked ? 'dead' : 'pickable'));
  const priced = !(odds === null || odds === undefined || odds === '') && !hideOdds;
  const why = blocked ? blockText(blocked, market, kind) : (selected ? 'Tap to remove' : '');
  return '<div class="' + cls + '" title="' + esc(why) + '"'
    + ' data-game="' + esc(g.id) + '" data-market="' + esc(market) + '"'
    + ' data-kind="' + esc(kind) + '" data-sel="' + esc(sel) + '"'
    + ' data-odds="' + ((odds === null || odds === undefined || odds === '') ? '' : esc(odds)) + '"'
    + ' data-meta="' + esc(JSON.stringify(meta || {})) + '">'
    + '<span class="main">' + esc(main) + '</span>'
    + '<span class="odds">' + (priced ? esc(signed(Number(odds))) : '') + '</span>'
    + '</div>';
}

function gameHtml(g){
  const started = gameStarted(g);
  const when = g.kickoff ? new Date(g.kickoff).toLocaleString(undefined,
    { weekday:'short', hour:'numeric', minute:'2-digit' }) : 'TBD';

  const sp = g.spread, to = g.totals, ml = g.moneyline;
  const favHome = !!(sp && sp.fav === 'home');
  const mag = sp ? Math.abs(numOr(sp.line, NaN)) : NaN;
  const awayLine = (sp && isFinite(mag)) ? (favHome ?  mag : -mag) : null;
  const homeLine = (sp && isFinite(mag)) ? (favHome ? -mag :  mag) : null;
  const awayPrice = sp ? (favHome ? sp.dogPrice : sp.favPrice) : null;
  const homePrice = sp ? (favHome ? sp.favPrice : sp.dogPrice) : null;
  const total = to ? to.total : null;

  const row = (team, line, price, kind, totKind, totPrice, mlOdds) =>
    '<div class="gameRow">'
    + '<div class="team"><span class="abbr" title="' + esc(team) + '">' + esc(shortName(team)) + '</span></div>'
    + cellHtml(g, 'spread', kind, team, line === null ? '' : signed(line), price, { line:line, price:price })
    + cellHtml(g, 'total', totKind, totKind === 'over' ? 'Over' : 'Under',
               total === null ? '' : (totKind === 'over' ? 'O ' : 'U ') + total, totPrice,
               { total:total, price:totPrice })
    + cellHtml(g, 'moneyline', 'ml', team,
               (mlOdds === null || mlOdds === undefined) ? '' : signed(Number(mlOdds)),
               mlOdds, { price:mlOdds }, true)
    + '</div>';

  return '<div class="game' + (started ? ' started' : '') + '">'
    + '<div class="gh"><span>' + esc(when) + '</span><span class="lg">' + esc(g.league) + '</span>'
    + (started ? '<span class="badge">Kicked off</span>' : '') + '</div>'
    + row(g.away_team, awayLine, awayPrice, favHome ? 'underdog' : 'favorite', 'over',
          to ? to.overPrice : null, ml ? ml.away : null)
    + row(g.home_team, homeLine, homePrice, favHome ? 'favorite' : 'underdog', 'under',
          to ? to.underPrice : null, ml ? ml.home : null)
    + '</div>';
}

/* =================== PICKS =================== */
function togglePick(game, market, kind, selection, meta, odds){
  const key = [game.id, market, kind, selection].join('|');
  const at = state.picks.findIndex(p => pickKeyOf(p) === key);
  if (at >= 0) state.picks.splice(at, 1);
  else {
    if (cellBlocked(game, market, kind, odds)) return;
    state.picks.push({
      week: isoDate(state.weekStart),
      league: String(game.league).toUpperCase(),
      gameId: game.id,
      /* "Away @ Home" is load-bearing: it is the only record of which side was
         home, and the backend parses it when grading and auditing. */
      matchup: game.away_team + ' @ ' + game.home_team,
      market: market, kind: kind, selection: selection,
      odds: (odds === '' || odds === null || odds === undefined) ? '' : Number(odds),
      meta: meta || {},
      kickoff: game.kickoff || null
    });
  }
  renderGames(); renderPicks(); validateRules();
}

const SLOTS = [
  { role:'FAV',   test:(p)=> p.market!=='moneyline' && p.kind==='favorite' },
  { role:'DOG',   test:(p)=> p.market!=='moneyline' && p.kind==='underdog' },
  { role:'OVER',  test:(p)=> p.market==='total' && p.kind==='over' },
  { role:'UNDER', test:(p)=> p.market==='total' && p.kind==='under' },
  { role:'ML',    test:(p)=> p.market==='moneyline' }
];

function renderPicks(){
  const host = el('#slotRow');
  if (!host) return;
  host.innerHTML = SLOTS.map((s, i) => {
    const p = state.picks.find(s.test);
    if (!p) return '<div class="slot"><span class="role">' + s.role + '</span></div>';
    const meta = p.meta || {};

    /* A total's selection is the word "Over" or "Under", which names no game -
       a slot reading UNDER / Under / 47.5 says nothing about what was picked.
       Show the matchup instead and put the number on the sub-line. Spreads and
       moneylines already name a team, so they keep it. */
    let label, sub;
    if (p.market === 'total') {
      const sides = String(p.matchup || '').split(' @ ');
      const full = sides.length === 2 ? shortName(sides[0]) + ' @ ' + shortName(sides[1])
                                      : String(p.matchup || '');
      /* Both forms ship; CSS picks one, since only CSS knows the width. */
      label = '<span class="wide">' + esc(full) + '</span>'
            + '<span class="narrow">' + esc(briefMatchup(p.matchup)) + '</span>';
      sub = (p.kind === 'under' ? 'U ' : 'O ') + meta.total;
      return '<div class="slot filled" data-slot="' + i + '" title="'
        + esc(p.selection + ' - ' + (p.matchup || '')) + '">'
        + '<span class="role">' + s.role + '</span>'
        + '<span class="pick">' + label + '</span>'
        + '<span class="sub">' + esc(sub) + '</span></div>';
    } else if (p.market === 'spread') {
      label = shortName(p.selection);
      sub = signed(Number(meta.line));
    } else {
      label = shortName(p.selection);
      sub = signed(Number(p.odds));
    }

    return '<div class="slot filled" data-slot="' + i + '" title="'
      + esc(p.selection + ' - ' + (p.matchup || '')) + '">'
      + '<span class="role">' + s.role + '</span>'
      + '<span class="pick">' + esc(label) + '</span>'
      + '<span class="sub">' + esc(sub) + '</span></div>';
  }).join('');

  els('#slotRow .slot.filled').forEach(node => {
    node.addEventListener('click', () => {
      const s = SLOTS[Number(node.dataset.slot)];
      const at = state.picks.findIndex(s.test);
      if (at >= 0){ state.picks.splice(at,1); renderGames(); renderPicks(); validateRules(); }
    });
  });
  const count = el('#slipCount'); if (count) count.textContent = state.picks.length + ' of 5';
}

function validateRules(){
  const nonML = state.picks.filter(p=>p.market!=='moneyline');
  const ml    = state.picks.filter(p=>p.market==='moneyline');
  const nfl = nonML.filter(p=>p.league==='NFL').length;
  const cfb = nonML.filter(p=>p.league==='NCAAF').length;
  const over  = nonML.filter(p=>p.kind==='over').length;
  const under = nonML.filter(p=>p.kind==='under').length;
  const fav   = nonML.filter(p=>p.kind==='favorite').length;
  const dog   = nonML.filter(p=>p.kind==='underdog').length;

  el('#ruleNFL').textContent = 'NFL: ' + nfl + '/2';
  el('#ruleCFB').textContent = 'CFB: ' + cfb + '/2';
  el('#ruleOU').textContent  = 'O/U: ' + over + ' Over / ' + under + ' Under';
  el('#ruleFD').textContent  = 'Fav/Dog: ' + fav + ' Fav / ' + dog + ' Dog';

  let mlOk = (ml.length === 1);
  let mlMsg = 'ML: ' + ml.length + '/1 (odds > -200)';
  if (ml.length === 1){
    const odds = Number(ml[0].odds);
    mlOk = isFinite(odds) && odds > -200;
    if (!mlOk) mlMsg += ' - invalid odds';
  }
  el('#ruleML').textContent = mlMsg;

  const rulesOK = (nfl===2 && cfb===2 && over===1 && under===1 && fav===1 && dog===1 && mlOk);
  const hasEmail = (el('#emailInput').value||'').trim().length > 0;

  /* College opens two weeks before the NFL does, so an early week can have no
     NFL games at all - and the slip needs two. Counting what is actually on
     the board stops the button saying "pick 2 more" when there is nothing left
     to pick. */
  const avail = { NFL:0, NCAAF:0 };
  for (const g of state.games){
    const lg = String(g.league || '').toUpperCase();
    if (avail[lg] !== undefined) avail[lg]++;
  }
  /* Only meaningful once a board exists. With nothing loaded at all, every
     league looks absent, and "no college games this week" would be a confident
     lie about a page that simply has not fetched yet. */
  const missing = !state.games.length ? null
                : (nfl < 2 && !avail.NFL) ? 'NFL'
                : (cfb < 2 && !avail.NCAAF) ? 'college' : null;

  const tally = el('#leagueTally');
  if (tally){
    tally.textContent = 'NFL ' + nfl + '/2 · CFB ' + cfb + '/2';
    tally.classList.toggle('done', nfl===2 && cfb===2);
  }

  const btn = el('#btnSubmit');
  btn.disabled = !(rulesOK && hasEmail);
  btn.classList.toggle('ready', rulesOK && hasEmail);
  btn.textContent = rulesOK
    ? (hasEmail ? 'Submit 5 picks' : 'Add your email to submit')
    : (missing ? 'No ' + missing + ' games this week'
               : 'Pick ' + (5 - state.picks.length) + ' more');

  const ws = el('#weekStatus');
  const wantSeason = SEASON.current;
  if (ws && wantSeason && wantSeason !== 'all'
      && seasonOfDate(state.weekStart) !== wantSeason){
    ws.textContent = 'This week is in ' + seasonOfDate(state.weekStart)
      + ', but the season selector says ' + wantSeason
      + '. Picks are filed by their week, so they would land in '
      + seasonOfDate(state.weekStart) + '.';
  } else if (ws && missing){
    ws.textContent = 'This week has no ' + missing + ' games, and a slip needs two. '
      + 'Nothing can be submitted for it - try a later week.';
  }

  el('#ruleMsg').textContent = rulesOK ? 'Ready to submit.'
    : 'Selections must satisfy all constraints (incl. 1 ML > -200).';
}

async function submitPicks(){
  const s = el('#submitStatus'), btn = el('#btnSubmit');
  const email=(el('#emailInput').value||'').trim();
  const name =(el('#nameInput').value||'').trim();
  if(!email){ s.textContent='Add your email first.'; s.className='alert err'; return; }
  try{ localStorage.setItem('pg_name',name); localStorage.setItem('pg_email',email); }catch(_){}

  btn.disabled=true; s.textContent='Submitting…'; s.className='alert';
  try{
    /* No custom headers: adding Content-Type triggers a CORS preflight that
       Apps Script does not answer, and the request fails outright. */
    const res = await fetch(
      CONFIG.API + '?fn=submit&email=' + encodeURIComponent(email)
        + '&user=' + encodeURIComponent(name||email),
      { method:'POST', body: JSON.stringify({ email:email, user:name||email,
                                              picks: state.picks, allowReplace:false }) });
    const text = await res.text();
    let j=null; try{ j=JSON.parse(text); }catch(_){
      s.textContent='Unexpected response: '+text.slice(0,140); s.className='alert err';
      btn.disabled=false; return;
    }
    if(j.ok){
      s.textContent='Picks in. You can change any of them until its own game kicks off.';
      s.className='alert ok';
      state.picks=[]; renderPicks(); validateRules(); renderGames(); loadMyPicks();
    }else{
      s.textContent=j.error||'Something went wrong.'; s.className='alert err'; btn.disabled=false;
    }
  }catch(e){
    s.textContent='Network error: '+(e.message||e); s.className='alert err'; btn.disabled=false;
  }
}

async function loadMyPicks(){
  const host = el('#mineBody');
  if (!host) return;
  const email=(el('#emailInput').value||'').trim();
  if(!email){ host.innerHTML='<div class="empty">Add your email above to see your picks.</div>'; return; }
  host.innerHTML='<div class="empty">Loading…</div>';
  try{
    const r=await fetch(apiUrl('mine',{ email:email }));
    const j=await r.json();
    const picks=(j && j.picks)||[];
    if(!picks.length){ host.innerHTML='<div class="empty">No picks yet this season.</div>'; return; }

    const byWeek={};
    for(const p of picks) (byWeek[p.week]=byWeek[p.week]||[]).push(p);
    const weeks=Object.keys(byWeek).sort().reverse();

    let html='';
    weeks.forEach((wk,i)=>{
      const rows=byWeek[wk];
      const w=rows.filter(p=>p.status==='win').length;
      const l=rows.filter(p=>p.status==='loss').length;
      const pend=rows.filter(p=>!p.status||p.status==='pending').length;
      if(i===0){
        html+='<div class="slipHead"><span class="wk">'+esc(wk)+'</span>'
            + '<span class="eyebrow">'+(pend?pend+' pending':'final')+'</span>'
            + '<span class="rec">'+w+'–'+l+'</span></div>'
            + rows.map(pickRowHtml).join('');
        if(weeks.length>1) html+='<div class="eyebrow" style="margin:18px 0 8px">Earlier weeks</div>';
      }else{
        html+='<div class="weekRow" data-week="'+esc(wk)+'"><span>'+esc(wk)+'</span>'
            + '<span class="rec">'+w+'–'+l+'</span></div>';
      }
    });
    host.innerHTML=html;

    /* Earlier weeks expand into the same slip rather than a dropdown. */
    els('#mineBody .weekRow').forEach(node=>{
      node.addEventListener('click',()=>{
        const rows=byWeek[node.dataset.week]||[];
        node.outerHTML='<div class="slipHead"><span class="wk">'+esc(node.dataset.week)+'</span></div>'
          + rows.map(pickRowHtml).join('');
      });
    });
  }catch(e){
    host.innerHTML='<div class="empty">Could not load your picks: '+esc(e.message||e)+'</div>';
  }
}

function pickRowHtml(p){
  const st=String(p.status||'pending').toLowerCase();
  const cls=(st==='win'||st==='loss')?st:'';
  const line=(p.line===''||p.line===null||p.line===undefined)?'':' '+signed(Number(p.line));
  const role=p.market==='moneyline'?'ML':String(p.kind||'').toUpperCase();
  const priced=!(p.odds===''||p.odds===null||p.odds===undefined);
  /* Both teams shortened for the second line - the full matchup is 40-odd
     characters and only ever gets ellipsed away on a phone. */
  const sides = String(p.matchup || '').split(' @ ');
  const shortMatchup = sides.length === 2
    ? shortName(sides[0]) + ' @ ' + shortName(sides[1]) : String(p.matchup || '');
  return '<div class="pickRow '+cls+'" title="'+esc(p.matchup)+'">'
    + '<span class="bar"></span>'
    + '<div class="mid">'
    +   '<div class="role">'+esc(role)+' · '+esc(p.league)+'</div>'
    +   '<div class="sel">'+esc(p.selection)+esc(line)+'</div>'
    +   '<div class="matchup">'+esc(shortMatchup)+'</div>'
    + '</div>'
    + '<div class="right">'
    +   '<div class="odds">'+(priced?esc(signed(Number(p.odds))):'')+'</div>'
    +   '<div class="status">'+esc(st.toUpperCase())+'</div>'
    + '</div></div>';
}

/* =================== SCOREBOARD =================== */
async function buildBoard(){
  const tbody=el('#boardTable tbody'), foot=el('#boardFoot');
  if(!tbody) return;
  tbody.innerHTML='<tr><td colspan="5" class="hint">Loading…</td></tr>';
  try{
    if(state.boardMode==='week'){ await buildBoardWeek(); return; }
    const r=await fetch(apiUrl('board')); const j=await r.json();
    const rows=(j && j.rows)||[];
    if(!rows.length){
      tbody.innerHTML='<tr><td colspan="5" class="hint">No graded picks yet.</td></tr>';
      foot.textContent=''; return;
    }
    /* The trophy marks the champion - most weeks won - which need not be the
       top row now that the table sorts on wins. */
    const mostWeeks=rows.reduce((m,x)=>Math.max(m,x.weeksWon||0),0);
    const best=rows.reduce((m,x)=>Math.max(m,x.pct||0),0)||1;
    tbody.innerHTML=rows.map((row,i)=>{
      const champ=mostWeeks>0 && row.weeksWon===mostWeeks;
      const pct=(row.pct||0).toFixed(3).replace(/^0/,'');
      return '<tr'+(i===0?' class="leader"':'')+'>'
        + '<td>'+(i+1)+'</td>'
        + '<td><span class="bname">'+esc(row.user)+(champ?' 🏆':'')+'</span>'
        + '<div class="brate"><i style="width:'+Math.round(((row.pct||0)/best)*100)+'%"></i></div></td>'
        + '<td>'+row.wins+'</td><td>'+row.losses+'</td>'
        + '<td class="bpct">'+pct+'</td></tr>';
    }).join('');
    foot.textContent='Sorted by total wins, then win percentage. 🏆 marks most weeks won.';
  }catch(e){
    tbody.innerHTML='<tr><td colspan="5" class="hint">Could not load: '+esc(e.message||e)+'</td></tr>';
  }
}

async function buildBoardWeek(){
  const tbody=el('#boardTable tbody'), foot=el('#boardFoot');

  /* The current calendar week, not the newest week that happens to have picks
     in it. Before anybody has submitted, the latter does not exist - and that
     is exactly when "who still owes me picks" is the question being asked. */
  const wk = isoDate(startOfWedWeek(new Date()));
  const r=await fetch(apiUrl('week',{ week:wk })); const j=await r.json();
  const rows=(j && j.rows)||[];
  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="5" class="hint">Nobody has played a week yet.</td></tr>';
    foot.textContent=''; return;
  }
  const expected=(j && j.expected)||5;

  tbody.innerHTML=rows.map((row,i)=>{
    const dec=row.wins+row.losses;
    const pct=dec?(row.wins/dec).toFixed(3).replace(/^0/,''):'-';
    const short = row.picks === 0 ? 'no picks yet'
                : !row.complete   ? row.picks + ' of ' + expected + ' picks'
                : '';
    return '<tr'+(row.winner?' class="leader"':'')
      + (row.complete?'':' class="owing"')+'>'
      + '<td>'+(row.picks?(i+1):'—')+'</td>'
      + '<td><span class="bname">'+esc(row.user)+'</span>'
      + (short?'<span class="owe">'+esc(short)+'</span>':'')+'</td>'
      + '<td>'+(row.picks?row.wins:'—')+'</td>'
      + '<td>'+(row.picks?row.losses:'—')+'</td>'
      + '<td class="bpct">'+(row.picks?pct:'—')+'</td></tr>';
  }).join('');

  const missing=(j && j.missing)||[];
  foot.textContent = wk + ' · '
    + (missing.length
        ? missing.length + ' still to pick: ' + missing.join(', ')
        : 'everybody is in')
    + (j.decided ? ' · won by ' + ((j.winners||[]).join(', ')||'nobody') : '');
}

const Q = { data:null, season:null };

const MARKET_LABEL = {
  moneyline:'Moneyline', spread_fav:'Spread - favourite', spread_dog:'Spread - underdog',
  spread_pk:'Spread - pick em', over:'Total - over', under:'Total - under'
};
const VIEW_TITLE = {
  players:'Win % by player', markets:'Win % by market', units:'Units by market',
  leagues:'NFL vs college', weeks:'Win % by week', cum:'Cumulative units',
  teamsW:'Best teams', teamsL:'Worst teams', teamsPct:'Win % by team'
};

/* A team picked once and won reads 1.000, which says nothing. Thirty-eight of
   the hundred-odd teams in a season are picked exactly once, so an unfiltered
   ranking is a list of coin flips. Four decided picks is where the noise stops
   drowning everything - but where to draw it is a judgement, so it is a control
   rather than a constant, remembered for the session like the season is. */
const TEAM_MIN_DEFAULT = 4;
const MIN_PICKS_KEY = 'pg_minpicks';
/* Only the team views have rows thin enough for this to matter. Every market
   has 109 picks and every player 60-plus, so a floor there would be a control
   that does nothing. */
const VIEWS_WITH_FLOOR = { teamsW:1, teamsL:1, teamsPct:1 };

function minPicks(){
  let v;
  try { v = Number(sessionStorage.getItem(MIN_PICKS_KEY)); } catch(_){}
  return (isFinite(v) && v > 0) ? v : TEAM_MIN_DEFAULT;
}
function setMinPicks(v){
  try { sessionStorage.setItem(MIN_PICKS_KEY, String(v)); } catch(_){}
}

/* Horizontal bars. Values can be negative (units), so the scale is drawn
   around zero rather than assuming everything grows rightwards. */
function drawBars(host, rows){
  if(!rows.length){ host.innerHTML='<div class="chartEmpty">Nothing to show for this selection.</div>'; return; }
  const vals=rows.map(r=>Number(r.value)||0);
  const lo=Math.min(0,Math.min.apply(null,vals)), hi=Math.max(0,Math.max.apply(null,vals));
  const span=(hi-lo)||1, zeroPct=((0-lo)/span)*100;
  const peak=Math.max.apply(null,vals.map(Math.abs));

  host.innerHTML='<div class="chartRows">'+rows.map(r=>{
    const v=Number(r.value)||0;
    const from=((Math.min(v,0)-lo)/span)*100, width=(Math.abs(v)/span)*100;
    /* The outermost bar is amber and the rest muted, so the answer reads first. */
    const cls=r.cls||(v<0?'neg':(Math.abs(v)===peak?'top':'pos'));
    return '<div class="chartRow">'
      + '<div class="lbl" title="'+esc(r.label)+'">'+esc(r.label)+'</div>'
      + '<div class="track">'
      + (lo<0?'<div class="zero" style="left:'+zeroPct.toFixed(2)+'%"></div>':'')
      + '<div class="bar '+cls+'" style="left:'+from.toFixed(2)+'%;width:'
      + Math.max(width,0.6).toFixed(2)+'%"></div></div>'
      + '<div class="val">'+esc(r.note||'')+'</div></div>';
  }).join('')+'</div>';
}

/* Time views draw a line. Win % clips the axis to 30-105 because everyone lands
   between .450 and .600 and a zero-based axis flattens the league into one
   blob; units keeps a signed axis around zero. */
function drawLine(host, points, opts){
  const o=opts||{};
  if(points.length<2){
    drawBars(host, points.map(p=>({ label:p.label, value:p.value, note:p.note })));
    return;
  }
  const vals=points.map(p=>Number(p.value)||0);
  const lo=(o.min!==undefined)?o.min:Math.min.apply(null,vals);
  const hi=(o.max!==undefined)?o.max:Math.max.apply(null,vals);
  const span=(hi-lo)||1;
  const W=320,H=150,PL=8,PR=8,PT=10,PB=18;
  const x=(i)=>PL+(i/(points.length-1))*(W-PL-PR);
  const y=(v)=>PT+(1-((v-lo)/span))*(H-PT-PB);
  const d=points.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(Number(p.value)||0).toFixed(1)).join(' ');
  const mid=(o.mid!==undefined)?o.mid:null;

  host.innerHTML='<div class="lineWrap"><svg viewBox="0 0 '+W+' '+H+'" role="img">'
    + ((mid!==null && mid>=lo && mid<=hi)
        ? '<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(mid).toFixed(1)+'" y2="'+y(mid).toFixed(1)
          + '" stroke="oklch(0.58 0.006 60)" stroke-width="1" stroke-dasharray="4 4"/>' : '')
    + '<path d="'+d+'" fill="none" stroke="oklch(0.80 0.16 75)" stroke-width="2"'
    + ' stroke-linejoin="round" stroke-linecap="round"/>'
    + points.map((p,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(Number(p.value)||0).toFixed(1)
        + '" r="2.8" fill="oklch(0.80 0.16 75)"><title>'
        + esc(p.label+' · '+(p.note||''))+'</title></circle>').join('')
    + '</svg></div>'
    + '<div class="chartRows" style="margin-top:10px">'
    + points.slice(-4).reverse().map(p=>'<div class="chartRow"><div class="lbl">'+esc(p.label)
        + '</div><div></div><div class="val">'+esc(p.note||'')+'</div></div>').join('')
    + '</div>';
}

/* Say what the floor did, including when it did nothing. A filter that is
   silently on is worse than one that is off. */
function floorNote(total, kept, floor){
  if (floor <= 1) return 'Every team is shown, including any picked only once - '
    + 'a single pick that won reads 1.000 and means nothing.';
  const cut = total - kept;
  return cut
    ? 'Teams picked fewer than ' + floor + ' times are left out - that is '
      + cut + ' of ' + total + ' here.'
    : 'No team fell below the ' + floor + '-pick minimum.';
}

async function loadQueryData(){
  const season=SEASON.current||'all';
  if(Q.data && Q.season===season) return Q.data;
  const r=await fetch(apiUrl('stats'));
  const j=await r.json();
  if(!j || j.ok===false) throw new Error((j && j.error)||'stats unavailable');
  Q.data=j; Q.season=season; return j;
}

async function buildQueries(){

function renderQuery(){
  const chart=el('#qChart'), summary=el('#qSummary'), note=el('#qNote');
  const title=el('#qTitle'), rail=el('#qRail');
  const data=Q.data; if(!data) return;

  const who=el('#qPlayer').value||'__all__';
  const view=el('#qView').value;
  const node=(data.stats||{})[who];

  if(title) title.textContent=VIEW_TITLE[view]||'';
  const minField=el('#qMinField');
  if(minField) minField.classList.toggle('hidden', !VIEWS_WITH_FLOOR[view]);
  if(!node){
    chart.innerHTML='<div class="chartEmpty">No graded picks for this selection.</div>';
    summary.textContent=''; note.textContent=''; if(rail) rail.innerHTML=''; return;
  }

  const label=(who==='__all__')?'All players':who;
  const o=node.overall;
  summary.textContent=label+' · '+recText(o)+' · '+pctText(o)+' · '+unitText(o.units)
    + ' · season '+data.season;

  const marketRows=(valueOf,noteOf,cls)=>Object.keys(MARKET_LABEL)
    .filter(k=>node.markets[k] && node.markets[k].n>0)
    .map(k=>{ const r=node.markets[k];
      return { label:MARKET_LABEL[k], value:valueOf(r), note:noteOf(r), cls:cls }; });

  let rows=[], tail='', drew=false;

  if(view==='players'){
    rows=(data.players||[]).map(p=>{
      const r=((data.stats[p]||{}).overall)||{w:0,l:0,p:0,units:0};
      return { label:p, value:(r.w+r.l)?r.w/(r.w+r.l):0, note:recText(r)+'  '+pctText(r) };
    }).sort((a,b)=>b.value-a.value);
    tail='Everyone in this season by win rate. The Player selector does not apply to this view.';

  }else if(view==='markets'){
    rows=marketRows(r=>(r.w+r.l)?r.w/(r.w+r.l):0, r=>recText(r)+'  '+pctText(r));
    tail='Win rate ignores pushes, which were never a decision. Break-even against a '
       + '-110 line is .524 - anything below that is losing money however good it looks.';

  }else if(view==='units'){
    rows=marketRows(r=>r.units, r=>unitText(r.units)+'  '+recText(r));
    tail='Profit on one unit staked per pick, at the real price. Unpriced picks are treated as -110.';

  }else if(view==='leagues'){
    const order=['NFL','NCAAF'];
    rows=Object.keys(node.leagues||{})
      .sort((a,b)=>(order.indexOf(a)-order.indexOf(b))||a.localeCompare(b))
      .filter(g=>node.leagues[g].n>0)
      .map(g=>{ const r=node.leagues[g];
        return { label:(g==='NCAAF')?'College (NCAAF)':g, value:(r.w+r.l)?r.w/(r.w+r.l):0,
                 note:recText(r)+'  '+pctText(r)+'  '+unitText(r.units) }; });
    tail='Two different sports to handicap, so worth separating. Break-even against a -110 line is .524 in both.';

  }else if(view==='weeks'){
    const pts=(node.weeks||[]).map(w=>({ label:String(w.week).slice(5),
      value:((w.w+w.l)?w.w/(w.w+w.l):0)*100, note:recText(w)+'  '+pctText(w) }));
    drawLine(chart, pts, { min:30, max:105, mid:50 }); drew=true;
    tail='Win rate per week. The axis starts at 30, not 0 - everyone lands between .450 and '
       + '.600, and a zero-based axis flattens the league into one blob. The dashed rule is '
       + '50%; break-even at -110 is .524, just above it.';

  }else if(view==='cum'){
    let run=0;
    const pts=(node.weeks||[]).map(w=>{ run+=Number(w.units)||0;
      return { label:String(w.week).slice(5), value:run, note:unitText(run) }; });
    drawLine(chart, pts, { mid:0 }); drew=true;
    tail='Running total of units. Above the dashed line is a profitable season to that point.';

  }else if(view==='teamsPct'){
    const floor=minPicks();
    const all=(node.teams||[]).filter(t=>(t.w+t.l)>0);
    const enough=all.filter(t=>(t.w+t.l)>=floor);
    rows=enough.slice()
      .sort((a,b)=>{
        const pa=a.w/(a.w+a.l), pb=b.w/(b.w+b.l);
        /* Equal rate, more picks first - 9-0 is better evidence than 4-0. */
        return (pb-pa)||((b.w+b.l)-(a.w+a.l))||a.team.localeCompare(b.team);
      })
      .slice(0,15)
      .map(t=>({ label:t.team, value:t.w/(t.w+t.l),
                 note:recText(t)+'  '+pctText(t)+'  '+unitText(t.units), cls:'win' }));
    tail='Ranked by win rate, spread and moneyline picks only. '
       + floorNote(all.length, enough.length, floor)
       + ' Equal rates are ordered by how many picks back them.';

  }else if(view==='teamsW'||view==='teamsL'){
    const wantWins=(view==='teamsW');
    const floor=minPicks();
    const all=(node.teams||[]).filter(t=>(wantWins?t.w:t.l)>0);
    const enough=all.filter(t=>(t.w+t.l)>=floor);
    rows=enough.slice()
      .sort((a,b)=>wantWins?((b.w-a.w)||(a.l-b.l)):((b.l-a.l)||(a.w-b.w)))
      .slice(0,12)
      .map(t=>({ label:t.team, value:wantWins?t.w:t.l,
                 note:recText(t)+'  '+unitText(t.units), cls:wantWins?'win':'loss' }));
    tail='Spread and moneyline picks only - a total names Over or Under, not a team. '
       + floorNote(all.length, enough.length, floor)
       + ' Top 12 by '+(wantWins?'wins.':'losses.');
  }

  if(!drew) drawBars(chart, rows);
  note.textContent=tail;

  /* Desktop rail: the chart and the exact numbers at once, which the phone has
     no room for. */
  if(rail){
    rail.innerHTML=rows.length
      ? '<div class="eyebrow" style="margin-bottom:8px">Ranked</div>'
        + rows.slice(0,12).map((r,i)=>'<div class="chartRow" style="grid-template-columns:20px 1fr auto">'
          + '<div class="lbl mono">'+(i+1)+'</div><div class="lbl">'+esc(r.label)+'</div>'
          + '<div class="val">'+esc(r.note||'')+'</div></div>').join('')
      : '';
  }
}

/* =================== HALL OF FAME =================== */
const CHAMPIONS = [
  { year:'2025-2026', name:'Whit Payne' },
  { year:'2024-2025', name:'Ivan' },
  { year:'2023-2024', name:'Clarke' },
  { year:'2022-2023', name:'Grant' }
];

async function buildHof(){
  const host=el('#hofBody');
  if(!host) return;
  let rows=null;
  try{ const r=await fetch(apiUrl('board')); const j=await r.json(); rows=(j&&j.rows)||null; }catch(_){}

  const champ=CHAMPIONS[0];
  const first=champ.name.split(' ')[0].toLowerCase();
  const row=rows?rows.find(x=>String(x.user).toLowerCase().indexOf(first)===0):null;

  const counts={};
  for(const c of CHAMPIONS) counts[c.name]=(counts[c.name]||0)+1;
  const repeats=Object.keys(counts).length!==CHAMPIONS.length;

  host.innerHTML =
      '<div class="eyebrow">Reigning champion</div>'
    + '<div class="champ"><img src="trophy-gold-transparent-background-19.webp" alt="Trophy">'
    + '<div class="nm">'+esc(champ.name)+'</div>'
    + '<div class="yr">'+esc(champ.year)+'</div>'
    /* Stats only when the season actually has them - printing an empty column
       beats inventing a record for a year with no data. */
    + (row ? '<div class="champStats">'
        + '<div><b>'+row.wins+'-'+row.losses+'</b><span>Record</span></div>'
        + '<div><b>'+(row.pct||0).toFixed(3).replace(/^0/,'')+'</b><span>Pct</span></div>'
        + '<div><b>'+row.weeksWon+'</b><span>Weeks won</span></div></div>' : '')
    + '</div>'
    + '<div class="eyebrow" style="margin:18px 0 8px">Past champions</div>'
    + CHAMPIONS.slice(1).map(c=>'<div class="pastRow">'
        + '<img src="trophy-gold-transparent-background-19.webp" alt="">'
        + '<span><strong>'+esc(c.name)+'</strong><br><span class="hint">'+esc(c.year)+'</span></span>'
        + '</div>').join('')
    + '<div class="eyebrow" style="margin:18px 0 8px">Titles by player</div>'
    + '<div class="titleChips">'
    + Object.keys(counts).sort((a,b)=>(counts[b]-counts[a])||a.localeCompare(b))
        .map(n=>'<span class="titleChip">'+esc(n)+' <b>×'+counts[n]+'</b></span>').join('')
    + '</div><div class="hint" style="margin-top:12px">'
    + (repeats ? '' : CHAMPIONS.length+' seasons, '+CHAMPIONS.length
        + ' different champions. Nobody has repeated.')
    + '</div>';
}

/* =================== NAV =================== */
function show(tab){
  els('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  els('.view').forEach(v=>{
    if(v.id==='view-'+tab) v.classList.remove('hidden'); else v.classList.add('hidden');
  });
}

function updateUserBadge(){
  const n=(el('#nameInput').value||'').trim(), e=(el('#emailInput').value||'').trim();
  state.name=n||null; state.email=e||null;
  try{ if(n) localStorage.setItem('pg_name',n); if(e) localStorage.setItem('pg_email',e); }catch(_){}
  const badge=el('#userBadge');
  if(badge){
    const initials=(n||e||'').split(/[\s@._-]+/).filter(Boolean).slice(0,2)
      .map(x=>x[0].toUpperCase()).join('');
    badge.textContent=initials;
    badge.classList.toggle('hidden',!initials);
  }
  validateRules();
}

function updateWeekLabel(){ el('#weekLabel').textContent=fmtWeek(state.weekStart); }

/* =================== INIT =================== */
document.addEventListener('DOMContentLoaded', ()=>{
  try{
    const sn=localStorage.getItem('pg_name')||'', se=localStorage.getItem('pg_email')||'';
    if(sn) el('#nameInput').value=sn;
    if(se) el('#emailInput').value=se;
  }catch(_){}
  updateUserBadge();

  el('#nameInput').addEventListener('input',updateUserBadge);
  el('#emailInput').addEventListener('input',updateUserBadge);
  el('#userBadge').addEventListener('click',()=>{
    el('#nameInput').value=''; el('#emailInput').value='';
    try{ localStorage.removeItem('pg_name'); localStorage.removeItem('pg_email'); }catch(_){}
    updateUserBadge();
  });

  els('.tab').forEach(t=>t.addEventListener('click',()=>{
    const tab=t.dataset.tab;
    show(tab);
    if(tab==='mine')    loadMyPicks();
    if(tab==='board')   buildBoard();
    if(tab==='queries') buildQueries();
    if(tab==='hof')     buildHof();
  }));

  el('#seasonPicker').addEventListener('change',e=>{
    SEASON.current=e.target.value;
    Q.data=null; Q.season=null;
    refreshSeasonViews();
  });
  el('#qPlayer').addEventListener('change',renderQuery);
  el('#qView').addEventListener('change',renderQuery);
  el('#qMinPicks').value = String(minPicks());
  el('#qMinPicks').addEventListener('change',e=>{ setMinPicks(e.target.value); renderQuery(); });

  el('#btnPrevWeek').addEventListener('click',()=>{
    state.weekStart=addDays(state.weekStart,-7); updateWeekLabel(); filterByWeek(); });
  el('#btnNextWeek').addEventListener('click',()=>{
    state.weekStart=addDays(state.weekStart,7); updateWeekLabel(); filterByWeek(); });
  el('#btnThisWeek').addEventListener('click',()=>{
    state.weekStart=startOfWedWeek(new Date()); updateWeekLabel(); filterByWeek(); });

  el('#gameSearch').addEventListener('input',e=>{ state.query=e.target.value; renderGames(); });
  el('#btnSort').addEventListener('click',()=>{
    state.sort=(state.sort+1)%SORTS.length; renderGames(); });
  els('#sportFilter .seg').forEach(seg=>seg.addEventListener('click',()=>{
    state.sport=seg.dataset.value;
    els('#sportFilter .seg').forEach(s=>s.classList.toggle('on',s===seg));
    renderGames();
  }));
  els('#boardMode .seg').forEach(seg=>seg.addEventListener('click',()=>{
    state.boardMode=seg.dataset.mode;
    els('#boardMode .seg').forEach(s=>s.classList.toggle('on',s===seg));
    buildBoard();
  }));
  el('#btnSubmit').addEventListener('click',submitPicks);

  updateWeekLabel(); renderPicks(); validateRules();

  if(!apiConfigured()){
    el('#games').innerHTML='<div class="empty"><strong>Backend not configured.</strong><br>'
      + 'This build went out without an Apps Script URL. Set '
      + '<span class="mono">APPS_SCRIPT_URL</span> in Netlify and redeploy.</div>';
    el('#btnSubmit').disabled=true;
    return;
  }

  /* Seasons first: the board should open already scoped rather than flashing
     every season and then correcting itself. */
  loadSeasons().then(fetchOdds);
});
</script>
